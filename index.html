
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1> Open Library Ammek kepala naga</h1>
        <p>Discover books from around the world</p>
    </header>

    <main>
        <input type="text" id="search"
            placeholder="Search title or author...">

        <div class="filters">
            <select id="category">
                <option value="">All Categories</option>
                <option value="Action">Action</option>
                <option value="science">Science</option>
                <option value="history">History</option>
                <option value="Documentary">Documentary</option>
            </select>

            <input type="number" id="year"
                placeholder="Publication year">
            <button onclick="searchBooks()">Search</button>
        </div>

        <p id="message">Loading books...</p>
        <section id="books"></section>

        <h2>Featured Book</h2>
        <div id="featured">Loading featured book...</div>

        <h2>Book Lists</h2>
        <div id="lists">Loading book lists...</div>
    </main>

    <footer>
        <p>Open Library Web Application</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
